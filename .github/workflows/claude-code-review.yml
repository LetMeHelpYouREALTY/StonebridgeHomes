# .github/workflows/claude-code-review.yml
# Manual-trigger review for LetMeHelpYouREALTY/StonebridgeHomes.
# Runs only when someone with write access comments "@claude review" on a pull request.
# Auth: GitHub side uses the repo's built-in GITHUB_TOKEN (no Claude GitHub App install needed).
# Model side uses ONE repo secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, Max subscription)
# or ANTHROPIC_API_KEY (Console key). Whichever is set is used; the other may stay empty.
# Source: code.claude.com/docs/en/github-actions, verified 2026-10-21.
name: Claude Code Review (manual)
on:
  issue_comment:
    types: [created]
concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude review"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review low --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}"
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
