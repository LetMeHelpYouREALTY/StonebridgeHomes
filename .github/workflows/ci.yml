name: 🔄 Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM UTC

env:
  NODE_VERSION: '20'
  NPM_VERSION: 'latest'

jobs:
  # 🧪 Test Suite
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 ESLint Analysis
        run: npm run lint --if-present

      - name: 🎨 Prettier Format Check
        run: npm run format:check --if-present

      - name: 🧪 Run Unit Tests
        run: npm test --if-present

      - name: 🏗️ Build Test
        run: npm run build

      - name: 📊 Test Coverage
        run: npm run test:coverage --if-present

  # 🔒 Security Audit
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔒 NPM Audit
        # audit-level=high: the 2 remaining moderate advisories are
        # esbuild's dev-server cross-origin issue (GHSA-67mh-4wv8-2f99),
        # pulled in transitively through Vite. They do not affect the
        # production bundle. Upgrading to the patched esbuild requires
        # Vite 6+, which Qwik 1.17 does not yet support. Revisit when
        # Qwik bumps its Vite floor.
        run: npm audit --audit-level=high

      - name: 🔒 CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🔒 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # 📊 Performance Testing — audits the Vercel preview deployment, not
  # a local server. The project uses Qwik + Vercel Edge SSR; auditing
  # the real preview captures CDN, edge SSR, and real network behavior
  # instead of an approximated local build. Requires a Vercel preview
  # deployment, so this job only runs on pull_request events.
  performance:
    name: 📊 Performance Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          # LHCI compares against ancestor commits; a shallow clone
          # breaks that and surfaces as "Could not find hash" errors.
          fetch-depth: 20

      - name: ⏳ Wait for Vercel Preview Deployment
        id: vercel_preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

      - name: 📊 Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: ${{ steps.vercel_preview.outputs.url }}
          configPath: './lighthouse.config.cjs'
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

  # 🧹 Dependency Updates
  dependencies:
    name: 🧹 Dependency Updates
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 🧹 Check for Updates
        run: npm outdated || true

      - name: 🔄 Auto Update Dependencies
        run: |
          npm update
          npm audit fix
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package*.json
          git diff --staged --quiet || git commit -m "🤖 Auto-update dependencies [skip ci]"
          git push
