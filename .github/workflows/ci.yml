name: 🔄 Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM UTC

env:
  NODE_VERSION: '20'
  NPM_VERSION: 'latest'

jobs:
  # 🧪 Test Suite
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 ESLint Analysis
        run: npm run lint --if-present

      - name: 🎨 Prettier Format Check
        run: npm run format:check --if-present

      - name: 🧪 Run Unit Tests
        run: npm test --if-present

      - name: 🏗️ Build Test
        run: npm run build

      - name: 📊 Test Coverage
        run: npm run test:coverage --if-present

  # 🔒 Security Audit
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔒 NPM Audit
        # audit-level=high keeps CI green on production-relevant issues.
        # Dev-only advisories that require Vite 8+ (outside Qwik's
        # supported peer range) are resolved by staying on Vite 6.4.6+
        # / Vitest 5 / Qwik 1.20 within the Qwik-compatible floor.
        run: npm audit --audit-level=high

      - name: 🔒 CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🔒 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # 📊 Performance Testing — audits the live Vercel preview (CDN + Edge
  # SSR). Previews use Vercel Authentication (SSO), so unprotected GETs
  # return 401. Set repo secret VERCEL_AUTOMATION_BYPASS_SECRET from
  # Vercel → Project → Deployment Protection → Protection Bypass for
  # Automation. The bypass is sent only as an HTTP header (never as a
  # query param on the audited URL) so it cannot leak into public LHCI
  # reports. Without that secret the job skips Lighthouse cleanly.
  performance:
    name: 📊 Performance Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          # LHCI compares against ancestor commits; a shallow clone
          # breaks that and surfaces as "Could not find hash" errors.
          fetch-depth: 20

      - name: ⏳ Resolve protected Vercel preview
        id: lh_target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET is not set. Skipping Lighthouse until the repo secret is added (Vercel Deployment Protection blocks preview URLs with HTTP 401)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resolve_preview() {
            local sha="${{ github.event.pull_request.head.sha }}"
            local id url=""
            id=$(gh api "repos/${{ github.repository }}/deployments?sha=${sha}&per_page=10" \
              --jq '[.[] | select(.environment|test("preview|Preview|Preview –"))] | .[0].id // empty' 2>/dev/null || true)
            if [ -z "${id}" ]; then
              id=$(gh api "repos/${{ github.repository }}/deployments?sha=${sha}&per_page=10" \
                --jq '.[0].id // empty' 2>/dev/null || true)
            fi
            if [ -n "${id}" ]; then
              url=$(gh api "repos/${{ github.repository }}/deployments/${id}/statuses" \
                --jq '[.[] | select(.state=="success") | .environment_url // .target_url] | map(select(. != null and . != "")) | first // empty' 2>/dev/null || true)
            fi
            echo "${url}"
          }

          PREVIEW_URL=""
          for i in $(seq 1 20); do
            PREVIEW_URL=$(resolve_preview || true)
            if [ -n "${PREVIEW_URL}" ]; then
              break
            fi
            sleep 15
          done

          if [ -z "${PREVIEW_URL}" ]; then
            echo "::warning::No Vercel preview URL found for this SHA yet. Skipping Lighthouse."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never put the bypass secret in the audited URL / GITHUB_OUTPUT —
          # LHCI reports persist requestedUrl and may be uploaded publicly.
          CODE="000"
          for i in $(seq 1 40); do
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "${PREVIEW_URL}" || echo "000")
            if [ "${CODE}" = "200" ]; then
              echo "url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "Preview ready (bypass via header only)"
              exit 0
            fi
            sleep 15
          done

          echo "::warning::Preview stayed unreachable with bypass header (last HTTP ${CODE}). Skipping Lighthouse."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: 📊 Lighthouse CI
        if: steps.lh_target.outputs.skip != 'true'
        uses: treosh/lighthouse-ci-action@v10
        env:
          # Read by lighthouse.config.cjs → collect.settings.extraHeaders
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          urls: ${{ steps.lh_target.outputs.url }}
          configPath: './lighthouse.config.cjs'
          uploadArtifacts: true
          # Public LHCI storage is fine only because the audited URL never
          # contains the bypass secret (header auth only).
          temporaryPublicStorage: true
          runs: 3

  # 🧹 Dependency Updates
  dependencies:
    name: 🧹 Dependency Updates
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 🧹 Check for Updates
        run: npm outdated || true

      - name: 🔄 Auto Update Dependencies
        run: |
          npm update
          npm audit fix
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package*.json
          git diff --staged --quiet || git commit -m "🤖 Auto-update dependencies [skip ci]"
          git push
